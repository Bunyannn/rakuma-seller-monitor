name: Monitor Rakuma Seller

on:
  schedule:
    # Run approximately every 5 minutes.
    - cron: "*/5 * * * *"

  # Allows manual testing from GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rakuma monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python monitor.py

      - name: Save monitoring state
        run: |
          git config user.name "rakuma-monitor"
          git config user.email "rakuma-monitor@users.noreply.github.com"

          git add seen_items.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Rakuma monitoring state"
            git push
          fi
